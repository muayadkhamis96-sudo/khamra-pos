# Khamra POS — joins the VPS's shared Caddy network; the Caddyfile proxies
# khamra.38.54.116.48.sslip.io -> khamra-api:8792 (app + API, one container).
# The port is NOT published to the host: Caddy is the only way in.
# Explicit project name: the compose dir is server/, whose default project
# name ("server") collides with wingy's and scrambles volume names.
name: khamra
services:
  khamra-api:
    build:
      context: ..                # repo root — the image carries the static app
      dockerfile: server/Dockerfile
    image: khamra-api
    container_name: khamra-api
    restart: unless-stopped
    environment:
      TZ: Asia/Muscat            # business "day" boundaries follow booth time
      DB_PATH: /data/khamra.db
    volumes:
      - khamra_data:/data
    networks: [web]

volumes:
  khamra_data:

networks:
  web:
    external: true
    name: spintt-academy_default
